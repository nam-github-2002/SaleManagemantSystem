<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Đã Đăng Ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Thông Tin Đã Đăng Ký</h2>
    <div id="info" class="mt-4">
      <!-- Thông tin sẽ được hiển thị ở đây -->
    </div>
    <button class="btn btn-primary mt-3" onclick="window.location.href='register.html'">Quay Lại Trang Đăng Ký</button>
  </div>

  <script>
    // Lấy dữ liệu từ localStorage và hiển thị trên trang
    window.onload = function() {
      const infoDiv = document.getElementById("info");
      const formData = JSON.parse(localStorage.getItem("formData"));
      
      if (formData) {
        infoDiv.innerHTML = `
          <p><strong>Họ và tên:</strong> ${formData.fullname}</p>
          <p><strong>Tên đăng nhập:</strong> ${formData.username}</p>
          <p><strong>Mật khẩu:</strong> ${formData.password}</p>
          <p><strong>Ngày sinh:</strong> ${formData.day}/${formData.month}/${formData.year}</p>
          <p><strong>Điện thoại:</strong> ${formData.phone}</p>
          <p><strong>Địa chỉ:</strong> ${formData.address}</p>
          <p><strong>Email khác:</strong> ${formData.email}</p>
          <p><strong>Sở thích:</strong> ${formData.interest}</p>
        `;
      } else {
        infoDiv.innerHTML = "<p>Không có thông tin đăng ký nào được tìm thấy.</p>";
      }
    }
  </script>
</body>
</html>
