<!DOCTYPE html>
<html lang="en">
<head>
  <div th:fragment="head">
    <title>Smart Seller</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/image/logoSmartSeller.png}" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- jQuery đầy đủ -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>


    <!--Fontawesome-->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <!--Excel-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- import css, js static-->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script th:src="@{/js/home.js}"></script>

  </div>
</head>
<body>

<div th:fragment="header">
  <header class="pe-2">
    <nav class="navbar navbar-expand-lg navbar-dark ">
      <a class="navbar-brand" href="#">SMART SELLER</a>
      <button type="button" id="sidebarCollapse" class="btn">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Logo -->
      <a class="logo-container" href="#">
        <img class="logo-brand" th:src="@{/image/logoSmartSeller.png}" alt="Logo Smart Seller">
      </a>
    </nav>
    <div class="col text-end d-flex justify-content-end align-items-center">
      <div class="user-info d-flex align-items-center">
        <div class="dropdown">

<!--      <img src="https://via.placeholder.com/40" alt="User Avatar" class="rounded-circle me-2"-->
          <img th:src="${currentUser.employeeId != null ? '/employees/display?id=' + currentUser.employeeId : '/images/noimage.jpg'}"
               id="user-avatar" data-toggle="dropdown" aria-expanded="false">
          <ul class="dropdown-menu hide" aria-labelledby="user-avatar">
            <li><a class="dropdown-item" href="#"><i class="fas fa-user"></i> View Profile</a></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-user-cog"></i> Account Setting</a></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-user-friends"></i> Switch Account</a></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-bell"></i> Notification</a></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle"></i> Help Center</a></li>
            <li>
              <form th:action="@{/logout}" method="post">
                <button class="border-0 dropdown-item" type="submit">
                  <i class="fas fa-sign-out-alt fs-6"></i> Logout
                </button>
              </form>
            </li>
          </ul>
        </div>

        <div>
          <p class="m-0 text-end" th:text="'Name: ' + ${currentUser.name} + ', ID: ' + ${currentUser.employeeId}"></p>
          <p class="m-0" id="current-date" align="right">Thứ Bảy, 12 tháng 10, 2024, 14:30:44</p>
        </div>
      </div>
    </div>
  </header>
</div>


<nav id="sidebar" th:fragment="sidebar">
  <ul class="nav flex-column">
    <li class="nav-item active">
      <a class="nav-link" href="/" onclick="getContent(event, this.href)">
        <i class="fas fa-home"></i>
        <span class="item-text">Hệ Thống</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/products" onclick="getContent(event, this.href)">
        <i class="fas fa-box"></i>
        <span class="item-text">Sản Phẩm</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/customers" onclick="getContent(event, this.href)">
        <i class="fas fa-user-tie"></i>
        <span class="item-text">Khách Hàng</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/orders"  onclick="getContent(event, this.href)">
        <i class="fas fa-shopping-cart"></i>
        <span class="item-text">Đơn Hàng</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/employees"  onclick="getContent(event, this.href)">
        <i class="fas fa-users"></i>
        <span class="item-text">Nhân Viên</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/suppliers" onclick="getContent(event, this.href)">
        <i class="fas fa-truck"></i>
        <span class="item-text">Nhà Cung Cấp</span>
      </a>
    </li>
  </ul>
</nav>

<div th:fragment="footer">
  <footer class="footer">
    <p class="footer-text mt-2">&copy; 2024 SMART SELLER. All Rights Reserved.</p>
  </footer>
</div>


</body>
</html>
