<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <div th:replace="~{/home :: head}"></div>
  <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>
<div class="container-fluid">
  <!-- header -->
  <div th:include="~{/home :: header(${currentUser})}" class="row p-2"></div>

  <!-- section -->
  <div class="row" id="sectionOfMain">
    <nav th:replace="~{home :: sidebar}" class="navbar sidebar col-md-2"></nav>

    <!-- Main Content -->
    <div th:fragment="customerPage" class="col-md-10 p-2">
      <h2 class="text-center mb-5">QUẢN LÝ KHÁCH HÀNG</h2>

      <a href="/customers/new" id="addNewCusButton" class="btn btn-primary ms-2">
        <i class="fa-solid fa-square-plus"></i>
        <span>Thêm Mới</span>
      </a>

      <!-- Search bar -->
      <div class="mb-4 mt-2 d-flex justify-content-end">
        <form th:action="@{/customers/search}" method="post" class="d-flex ms-auto" ID="search-form">
          <div class="input-group" >
            <label>
              <input type="text" class="form-control" th:name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo tên công ty...">
            </label>
            <button class="btn btn-outline-secondary" type="submit">Tìm Kiếm</button>
          </div>
          <div th:if="${error != false}" class="text-danger mt-2">
              <p th:text="${error}"></p>
          </div>
        </form>
      </div>
      <!-- Search bar -->


      <!-- Table  -->
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
          <tr>
            <th>#ID</th>
            <th>Tên Khách Hàng</th>
            <th>Email</th>
            <th>Nhóm</th>
            <th>Thao Tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="customer : ${customers}">
            <td th:text="${customer.customerID}"></td>
            <td th:text="${customer.companyName}"></td>
            <td th:text="${customer.email}"></td>
            <td th:text="${customer.type}"></td>
            <td>
              <a class="btn btn-hover-shine btn-outline-primary border-0 btn-sm" th:href="@{/customers/detail/{id}(id=${customer.customerID})}">Detail</a>
              <a style="text-decoration: none" th:href="@{/customers/edit/{id}(id=${customer.customerID})}">
                <button class="btn btn-outline-warning border-0 btn-sm"><i class="fa-solid fa-pen-to-square"></i></button>
              </a>

              <form th:action="@{/customers/{id}(id=${customer.customerID})}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="DELETE" />
                <button type="submit" class="btn btn-outline-danger border-0 btn-sm"><i class="fa-solid fa-trash"></i></button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <!-- Table  -->


      <!-- Phân trang -->
      <nav class="d-flex justify-content-end">
        <ul class="pagination">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/customers(page=${currentPage - 1})}">Previous</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/customers(page=${i})}" th:text="${i + 1}"></a>
          </li>
          <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/customers(page=${currentPage + 1})}">Next</a>
          </li>
        </ul>
      </nav>
      <!-- Phân trang -->

    </div>
    <!-- Main Content -->


  </div>
</div>

</body>
</html>
