<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <div th:replace="~{fragments/fragment :: head}"></div>
</head>
<body>
<div class="container-fluid">

  <!-- header -->
  <div th:replace="~{fragments/fragment :: header}"></div>

  <!-- section -->
  <div class="d-flex" style="height: calc(100vh - 60px);">

    <!-- Sidebar-->
    <nav th:replace="~{fragments/fragment :: sidebar}"></nav>
    <!-- Sidebar -->

    <div id="mainArea">
      <div th:fragment="customerPage">

        <section class="content-header">
          <h1>Quản lý khách hàng</h1>
          <ol class="breadcrumb">
            <li><a href="/" onclick="getContent(event, this.href)"><i class="fa fa-home"></i>Home</a></li>
            <li class="active"><i class="fas fa-box"></i>Customer</li>
          </ol>
        </section>

        <section class="content-main px-3">
          <div class="productMan">

            <div class="row mb-3">
              <!-- Cột nút hành động -->
              <div class="col-md-6">
                <a  onclick="getContent(event, this.href)" href="/customers/new" class="btn btn-primary btn-sm">+ Thêm khách hàng</a>
                <button id="exportExcelBtn"
                        class="btn btn-success btn-sm"
                        onclick="exportTableToExcel()">Xuất ra Excel</button>
              </div>

                <!-- Tìm kiếm -->
              <div class="col-md-6 d-flex justify-content-end flex-column">
              <div class="form-inline ml-auto mt-4">
                <form action="/customers/search"
                      onsubmit="postContent(this)"
                      method="POST"
                      class="d-flex search-form">
                  <input  type="text" class="form-control" placeholder="Tìm kiếm..." name="keyword" aria-label="Search">
                  <button type="submit" class="btn btn-primary ml-2">
                    Tìm kiếm
                  </button>
                </form>
              </div>
            </div>

            </div>

            <!-- Table  -->
             <div class="table-responsive">
              <table class="table table-hover">
                <thead class="table-light">
                <tr>
                  <th>#ID</th>
                  <th>Tên Khách Hàng</th>
                  <th>Email</th>
                  <th>Nhóm</th>
                  <th>Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customers}">
                  <td th:text="${customer.customerID}"></td>
                  <td th:text="${customer.companyName}"></td>
                  <td th:text="${customer.email}"></td>
                  <td th:text="${customer.type}"></td>
                  <td>
                    <a class="btn btn-hover-shine btn-outline-primary border-0 btn-sm"
                       th:href="@{/customers/detail/{id}(id=${customer.customerID})}"
                       onclick="getContent(event, this.href)">
                      Detail
                    </a>
                    <a style="text-decoration: none"
                       th:href="@{/customers/edit/{id}(id=${customer.customerID})}"
                       onclick="getContent(event, this.href)">
                      <button class="btn btn-outline-warning border-0 btn-sm"><i class="fa-solid fa-pen-to-square"></i></button>
                    </a>

                    <form th:action="@{/customers/delete/{id}(id=${customer.customerID})}"
                          method="post" style="display:inline;"
                          onsubmit="postContent(event, this)">
                      <input type="hidden" name="_method" value="DELETE" />
                      <button type="submit" class="btn btn-outline-danger border-0 btn-sm">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </form>
                  </td>

                </tr>
                </tbody>
              </table>
            </div>
            <!-- Table  -->

            <!-- Phân trang -->
            <nav class="d-flex justify-content-end">
              <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                  <a class="page-link"
                     onclick="getContent(event, this.href)" th:href="@{/customers(page=${currentPage - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                  <a class="page-link"
                     onclick="getContent(event, this.href)" th:href="@{/customers(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item"  th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                  <a class="page-link"
                     onclick="getContent(event, this.href)" th:href="@{/customers(page=${currentPage + 1})}">Next</a>
                </li>
              </ul>
            </nav>
            <!-- Phân trang -->
          </div>
        </section>

      </div>
    </div>
  </div>
  <!-- section -->
  <!-- footer -->
  <div th:replace="~{fragments/fragment :: footer}"></div>
</div>
</body>
</html>
