<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <div th:replace="~{fragments/fragment :: head}"></div>
</head>
<body>
<div class="container-fluid">

  <!-- header -->
  <div th:replace="~{fragments/fragment :: header}"></div>

  <!-- section -->
  <div class="d-flex" style="height: calc(100vh - 60px);">

    <!-- Sidebar-->
    <nav th:replace="~{fragments/fragment :: sidebar}"></nav>
    <!-- Sidebar -->

    <div id="mainArea">
      <div th:fragment="customerPage">
    <h2 class="text-center mb-5">QUẢN LÝ KHÁCH HÀNG</h2>

    <a href="/customers/new" onclick="getContent(event,this.href)" id="addNewCusButton" class="btn btn-primary ms-2">
      <i class="fa-solid fa-square-plus"></i>
      <span>Thêm Mới</span>
    </a>

    <!-- Search bar -->
    <div class="mb-4 mt-2 d-flex justify-content-end">
      <form th:action="@{/customers/search}" method="post"
            onsubmit="postContent(event, this)"
            class="d-flex ms-auto" id="search-form">

        <div class="input-group">
          <input type="text" class="form-control" name="keyword"
                 th:value="${keyword}" placeholder="Tìm kiếm theo tên công ty...">
        </div>
        <button class="btn btn-outline-secondary ms-2 form-control" type="submit" style="width: 50%">Tìm Kiếm</button>
        <div th:if="${error != false}" class="text-danger mt-2">
          <p th:text="${error}"></p>
        </div>
      </form>
    </div>
    <!-- Search bar -->

    <!-- Table  -->
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-light">
        <tr>
          <th>#ID</th>
          <th>Tên Khách Hàng</th>
          <th>Email</th>
          <th>Nhóm</th>
          <th>Thao Tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
          <td th:text="${customer.customerID}"></td>
          <td th:text="${customer.companyName}"></td>
          <td th:text="${customer.email}"></td>
          <td th:text="${customer.type}"></td>
          <td>
            <a class="btn btn-hover-shine btn-outline-primary border-0 btn-sm"
               th:href="@{/customers/detail/{id}(id=${customer.customerID})}"
               onclick="getContent(event, this.href)">
              Detail
            </a>
            <a style="text-decoration: none"
               th:href="@{/customers/edit/{id}(id=${customer.customerID})}"
               onclick="getContent(event, this.href)">
              <button class="btn btn-outline-warning border-0 btn-sm"><i class="fa-solid fa-pen-to-square"></i></button>
            </a>

            <form th:action="@{/customers/{id}(id=${customer.customerID})}"
                  method="post" style="display:inline;"
                  onsubmit="postContent(event, this)">
              <input type="hidden" name="_method" value="DELETE" />
              <button type="submit" class="btn btn-outline-danger border-0 btn-sm">
                <i class="fa-solid fa-trash"></i>
              </button>
            </form>
          </td>

        </tr>
        </tbody>
      </table>
    </div>
    <!-- Table  -->


    <!-- Phân trang -->
    <nav class="d-flex justify-content-end">
      <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link"
             onclick="getContent(event, this.href)" th:href="@{/customers(page=${currentPage - 1})}">Previous</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link"
             onclick="getContent(event, this.href)" th:href="@{/customers(page=${i})}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item"  th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link"
             onclick="getContent(event, this.href)" th:href="@{/customers(page=${currentPage + 1})}">Next</a>
        </li>
      </ul>
    </nav>
    <!-- Phân trang -->

  </div>
    </div>


</div>
<!-- section -->

  <!-- footer -->
  <div th:replace="~{fragments/fragment :: footer}"></div>
</div>

</body>
</html>
