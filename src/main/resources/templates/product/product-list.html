<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Smart Seller | Danh sách sản phẩm')}"></head>
<body>
<div class="container-fluid">
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="d-flex" style="height: calc(100vh - 60px);">
        <!-- Sidebar -->
        <div th:replace="fragments/sidebar :: sidebar('products')"></div>

        <!-- Page Content -->
        <div id="content">
            <section class="content-header">
                <h1>Quản lý sản phẩm</h1>
                <ol class="breadcrumb">
                    <li><a th:href="@{/}"><i class="fa fa-home"></i> Trang chủ</a></li>
                    <li class="active"><i class="fas fa-box"></i> Sản phẩm</li>
                </ol>
            </section>

            <section class="content-main px-3">
                <div class="productMan">
                    <!-- Action buttons and summary -->
                    <div class="row mb-3">
                        <!-- Cột nút hành động -->
                        <div class="col-md-6">
                            <button class="btn btn-primary btn-sm">+ Thêm sản phẩm mới</button>
                            <button class="btn btn-success btn-sm">Xuất ra Excel</button>
                        </div>
                        <!-- Cột lọc theo danh mục -->
                        <div class="col-md-6 d-flex justify-content-end">
                            <div class="form-inline">
                                <label for="categoryFilter" class="mr-2">Lọc theo danh mục:</label>
                                <select id="categoryFilter" class="form-control form-control-sm">
                                    <option value="">Tất cả</option>
                                    <option value="Điện tử">Điện tử</option>
                                    <option value="Thời trang nam">Thời trang nam</option>
                                    <option value="Thời trang nữ">Thời trang nữ</option>
                                    <option value="Thời trang trẻ em">Thời trang trẻ em</option>
                                    <option value="Giày dép">Giày dép</option>
                                    <option value="Mỹ phẩm">Mỹ phẩm</option>
                                    <option value="Sức khỏe">Sức khỏe</option>
                                    <option value="Gia dụng">Gia dụng</option>
                                    <option value="Nhà cửa">Nhà cửa</option>
                                    <option value="Oto xe máy">Oto xe máy</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- Bảng danh sách sản phẩm -->
                    <table id="productTable" class="table table-bordered table-hover">
                        <thead class="thead-light">
                        <tr>
                            <th>#</th>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Nhà cung cấp</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>1</td>
                            <td>
                                <img src="../../static/image/1DienTuCongNghe/DienTuCongNghe%20(1).jpg" alt="">
                            </td>
                            <td>Loa Bluetooth 5.0 Bass mạnh</td>
                            <td>Sonny</td>
                            <td>Điện tử</td>
                            <td>200,000 VND</td>
                            <td>10</td>
                            <td>
                                <button class="btn btn-primary btn-sm">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>
                                <img src="../../static/image/2ThoiTrangNam/ThoiTrangNam%20(1).jpg" alt="">
                            </td>
                            <td>Quần Jogger nam màu đen</td>
                            <td>Korea Fashion</td>
                            <td>Thời trang nam</td>
                            <td>500,000 VND</td>
                            <td>18</td>
                            <td>
                                <button class="btn btn-primary btn-sm">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>
                                <img src="../../static/image/3MyPham/mypham%20(1).jpg" alt="">
                            </td>
                            <td>Sửa tắm nữ QLAY</td>
                            <td>Korean Beauty</td>
                            <td>Mỹ phẩm</td>
                            <td>670,000 VND</td>
                            <td>5</td>
                            <td>
                                <button class="btn btn-primary btn-sm">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Footer -->
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
</body>
</html>
