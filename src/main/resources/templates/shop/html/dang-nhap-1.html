<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sneaker Space | Đăng nhập tài khoản</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- jQuery đầy đủ -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</head>
<style>
    /* CSS tùy chỉnh */
    body {
        background-color: #f5f5f5;
        background-image: url(./backgroundDangNhap.png);
        overflow: hidden;
        background-repeat: no-repeat;
        background-size: cover;
        backdrop-filter: blur(8px);
    }

    /* body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url(../image/backgroundDangNhap.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        filter: blur(8px); 
        z-index: -1;
    }
    */

    .login-container {
        background-color: rgba(10, 10, 10, 0.5);
        box-shadow: 0 0 10px black;
        border-radius: 8px;
        padding: 40px;
        max-width: 400px;
        margin: auto;
    }

    .login-title {
        color: #ffffff;
        font-weight: bold;
    }

    .form-label {
        font-weight: 500;
        color: #ffffff;
    }

    .input-group-text {
        background-color: #e9ecef;
    }

    .register-link {
        color: #BBBBBB;
        text-decoration: none;
    }

    .register-link:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="login-container">
                <h3 class="text-center mb-4 login-title">Đăng nhập</h3>
                <form action="" id="form-login" onsubmit="login(event)">
                    <div class="form-group mb-3">
                        <label for="tendn" class="form-label">Tên đăng nhập</label>
                        <span id="enrrtendn" class="text-danger">*</span>
                        <div class="input-group">
                            <span class="input-group-text"><i class="far fa-user"></i></span>
                            <input type="text" id="tendn" class="form-control" placeholder="Nhập tên đăng nhập">
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="matkhau" class="form-label">Mật khẩu</label>
                        <span id="enrrmk" class="text-danger">*</span>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" id="matkhau" class="form-control" placeholder="Nhập mật khẩu">
                            <span class="input-group-text" id="eye">
                                <i class="far fa-eye" onclick="togglePasswordVisibility()"></i>
                            </span>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Đăng nhập</button>
                    </div>
                    <hr class="d-flex align-items-center w-100 mx-auto">
                    <p class="text-white text-center">Bạn chưa có tài khoản?
                        <a href="../html/dang-ky.html" class="register-link">Đăng ký</a> tài khoản ngay!
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script>
        // Hiển thị hoặc ẩn mật khẩu
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("matkhau");
            const eyeIcon = document.getElementById("eye").querySelector("i");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        // Thêm tài khoản mẫu vào localStorage nếu chưa tồn tại
        if (!localStorage.getItem('users')) {
            const demoUser = [{ username: "admin", password: "admin" }];
            localStorage.setItem('users', JSON.stringify(demoUser));
        }

        // Hàm đăng nhập
        function login(event) {
            event.preventDefault();

            const usernameInput = document.getElementById("tendn").value.trim();
            const passwordInput = document.getElementById("matkhau").value.trim();
            const usernameError = document.getElementById("enrrtendn");
            const passwordError = document.getElementById("enrrmk");

            // Reset thông báo lỗi
            usernameError.textContent = passwordError.textContent = "*";

            // Kiểm tra tên đăng nhập và mật khẩu có trống không
            if (usernameInput === "") {
                usernameError.textContent = "Vui lòng nhập tên đăng nhập.";
                document.getElementById("tendn").focus();
                return;
            }
            if (passwordInput === "") {
                passwordError.textContent = "Vui lòng nhập mật khẩu.";
                document.getElementById("matkhau").focus();
                return;
            }

            // Lấy danh sách người dùng từ localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(user => user.username === usernameInput);

            if (user) {
                // Nếu tìm thấy tên đăng nhập, kiểm tra mật khẩu
                if (user.password === passwordInput) {
                    alert("Đăng nhập thành công!");
                    window.location.href = "./trang-chu.html"; // Chuyển đến trang chủ
                } else {
                    passwordError.textContent = "Mật khẩu không đúng.";
                    document.getElementById("matkhau").focus(); // Đặt focus vào ô mật khẩu
                }
            } else {
                // Nếu không tìm thấy tên đăng nhập trong dữ liệu
                usernameError.textContent = "Tên đăng nhập không tồn tại.";
                document.getElementById("tendn").focus();
            }
        }
    </script>
</body>

</html>
