<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">

    <h1 class="mb-4 text-center">Shop</h1>

    <!-- Danh mục sản phẩm -->
    <div class="mb-3 text-center">
        <a th:href="@{/shop}" class="btn btn-primary">Tất cả</a>
        <a th:href="@{/shop(category='electronics')}" class="btn btn-outline-primary">Điện tử</a>
        <a th:href="@{/shop(category='fashion')}" class="btn btn-outline-primary">Thời trang</a>
        <a th:href="@{/shop(category='home')}" class="btn btn-outline-primary">Đồ gia dụng</a>
    </div>

    <!-- Hiển thị sản phẩm -->
    <div class="row">
        <div class="col-md-3" th:each="product : ${products}">
            <div class="card mb-4">
<!--                -->
                <img th:src="@{'/products/display?id=' + ${productImages[product.productID]}}"
                     class="card-img-top" alt="Product Image">



                <div class="card-body">
                    <h5 class="card-title" th:text="${product.productName}">Tên sản phẩm</h5>
                    <p class="card-text" th:text="${product.price} + ' VND'">Giá</p>
                    <a th:href="@{/products/detail/{id}(id=${product.productID})}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Phân trang -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/shop(page=${currentPage - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/shop(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/shop(page=${currentPage + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
