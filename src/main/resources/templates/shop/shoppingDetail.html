<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Smart Seller | Cửa Hàng - Chi tiết sản phẩm</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" th:href="@{/image/logoSmartSeller.png}" type="image/x-icon">
  <link rel="shortcut icon" href="../img/logoSmartSeller.png" type="image/x-icon">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- jQuery đầy đủ -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!--Fontawesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/shopping.css}">
  <script th:src="@{/js/shopping.js}"></script>

</head>

<body>
<div class="container-fluid">
  <div class="row header-shop-top bg-success text-white p-2 sticky-top">
      <div class="col-md-4 col-sm-6 my-1 d-flex align-items-center justify-content-center">
        <i class="fa-solid fa-calendar-days mr-2"> </i>
        <span id="current-date"> 16/11/2024</span>
      </div>
      <div class="col-md-4 my-1 col"></div>
      <div class="col-md-4 my-1 col-sm-5">
        <div class="user-info d-flex align-items-center justify-content-center">
          <!-- Kiểm tra nếu người dùng đã đăng nhập -->
          <div th:if="${loggedInCustomer == null}">
            <!-- Nếu chưa đăng nhập, hiển thị nút đăng nhập và đăng ký -->
            <a href="/login" class="btn btn-primary mx-2">Đăng nhập</a>
            <a href="/register" class="btn btn-success mx-2">Đăng ký</a>
          </div>

          <div th:if="${loggedInCustomer != null}" class="d-flex">
            <!-- Nếu đã đăng nhập, hiển thị avatar và menu -->
            <div class="dropdown">
              <img th:src="${loggedInCustomer != null ? '/employees/display?id=' + loggedInCustomer.customerID : '/images/noimage.jpg'}"
                   class="rounded-circle"
                   style="width: 20px; height: 20px;"
                   id="user-avatar" data-toggle="dropdown" aria-expanded="false">

              <ul class="dropdown-menu" aria-labelledby="user-avatar">
                <li><a class="dropdown-item" href="#"><i class="fas fa-user text-primary"></i> Tài khoản của tôi</a></li>
                <li><a class="dropdown-item" href="#"><i class="fas fa-clipboard-list text-info"></i> Đơn mua</a></li>
                <li><a class="dropdown-item" href="#"><i class="fas fa-bell text-warning"></i> Thông báo</a></li>
                <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle text-warning"></i> Hỗ trợ</a></li>
                <li>
                  <form th:action="@{/logout}" method="post">
                    <button class="dropdown-item border-0" type="submit"
                            onclick="localStorage.setItem('cartCount', 0); updateCartCount(0)">
                      <i class="fas fa-sign-out-alt text-secondary"></i> Đăng xuất
                    </button>
                  </form>
                </li>
              </ul>
            </div>
            <div class="user-text">
              <p class="m-0" th:text="${loggedInCustomer != null ? 'Xin Chào ' + loggedInCustomer.name : ' '}">Xin chào,</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Logo và thương hiệu -->
      <div class="col-md-3 col-sm-3 my-1 text-center">
        <a class="navbar-brand d-flex align-items-center justify-content-center" href="#">
          <!-- <img src="logoSmartSeller.png" alt="logo" style="width:75px;" class="mr-2"> -->
          <span class="font-weight-bold text-white">SMART SELLER</span>
        </a>
      </div>
      <!-- Form tìm kiếm -->
      <div class="col-md-6 col-sm-7 my-1">
        <form id="nav-form-search" class="form-inline">
          <div class="input-group w-100  justify-content-center">
            <!-- Danh mục sản phẩm -->
            <select name="" id="select-product-category" class="custom-select col-3">
              <option value="">Tất cả</option>
              <option value="Laptops">Laptops</option>
              <option value="Smartphones">Smartphones</option>
              <option value="Tablets">Tablets</option>
              <option value="Desktops">Desktops</option>
              <option value="Giày dép">Giày dép</option>
              <option value="Mỹ phẩm">Mỹ phẩm</option>
              <option value="Sức khỏe">Sức khỏe</option>
              <option value="Gia dụng">Gia dụng</option>
              <option value="Nhà cửa">Nhà cửa</option>
              <option value="Oto xe máy">Oto xe máy</option>

            </select>

            <!-- Ô tìm kiếm -->
            <input type="text" class="form-control col-7" placeholder="Tìm sản phẩm, thương hiệu,...">

            <!-- Nút tìm kiếm -->
            <div class="input-group-append">
              <button class="btn btn-light" type="submit">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- giỏ hàng -->
      <div th:classappend="${loggedInCustomer != null ? '' : 'd-none'}"
           class="col-md-3 col-sm-2 my-1 text-center justify-content-center align-items-center">
        <div class="header-top-main-cart position-relative p-0" style="width: 30px;margin: 10px auto;">
          <!-- Nút giỏ hàng -->
          <a class="nav-link d-flex align-items-center justify-content-center text-white position-relative"
             href="/cart" id="cartIcon" style=" width: 30px; height: 20px;">
            <i class="fas fa-shopping-cart fa-lg" style=" z-index: 10;"></i>
            <span class="badge-pill badge-danger" id="cartCountBadge" style=" z-index: 12;position: absolute;
                        top: 0;  left: 50%; width: 20px;transform: translate(20%, -60%);height: 20px;padding: 0 0 6px;">0</span>
          </a>
        </div>
      </div>

    </div>
  <div class="container mt-3">
    <!-- Hiển thị thông báo lỗi nếu không tìm thấy sản phẩm -->
    <div th:if="${error}" class="alert alert-danger">
      <span th:text="${error}"></span>
    </div>

    <!-- Hiển thị chi tiết sản phẩm nếu có -->
    <div th:if="${product}" class="row">
      <!-- Nút quay lại -->
      <a th:href="@{/}" class="btn btn-secondary btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Quay lại
      </a>
      <div class="col-12">
        <h1 class="text-center" th:text="${product.productName}">Tên sản phẩm</h1>
      </div>

      <!-- Hiển thị hình ảnh sản phẩm -->
      <div class="col-md-4 product-gallery">
        <div>
          <!-- Thay đổi ID của ảnh chính -->
          <img id="mainImageDisplay" th:if="${images != null && !#lists.isEmpty(images)}"
            th:src="@{'/products/display?id=' + ${images[0]}}" alt="Product Image" class="img-fluid"
            style="max-height: 400px; object-fit: contain; border-radius: 10px;">
          <img id="mainImageDisplay" th:if="${images == null || #lists.isEmpty(images)}" src="/image/noimage.jpg"
            alt="No Image Available" class="img-fluid"
            style="max-height: 400px; object-fit: contain; border-radius: 10px;">
        </div>

        <!-- Thumbnails -->
        <div th:if="${images != null && images.size() > 1}" class="product-thumbnails">
          <div th:each="image, indexStat : ${images}" class="p-1">
            <!-- Thay đổi ID thumbnail và onclick -->
            <img id="thumbnail-[[${indexStat.index}]]" th:src="@{'/products/display?id=' + ${image}}"
              class="product-thumbnail" th:classappend="${indexStat.index == 0} ? 'active' : ''"
              style="width: 80px; height: 80px; object-fit: contain;" onclick="changeMainImage(this)">
          </div>
        </div>
      </div>

      <!-- Thông tin chi tiết sản phẩm -->
      <div class="col-md-8">
        <p class="lead" th:text="'Mã sản phẩm: ' + ${product.productID}">Mã sản phẩm: 100</p>
        <p class="lead" th:text="'Danh mục: ' + ${product.category.categoryName}">Danh mục: Smartphones</p>
        <p class="lead" th:text="'Nhà cung cấp: ' + ${product.supplier.supplierName}">Nhà cung cấp: Công ty ABC</p>
        <p class="lead" th:text="'Số lượng tồn kho: ' + ${product.quantity}">Số lượng tồn kho: 50</p>
        <p class="lead text-success font-weight-bold" th:text="'Giá: ' + ${product.price} + ' VND'">Giá: 100.000 VND</p>
        <!-- Các nút chức năng -->
        <div class="mt-4">
          <button th:onclick="|addToCart(${product.productID})|" class="btn btn-success btn-lg me-2">
            Thêm vào giỏ hàng
            <i class="fas fa-cart-plus"></i>
          </button>
          <a href="/cart" th:onclick="|addToCart(${product.productID}, true)|"  class="btn btn-primary btn-lg">Mua ngay</a>
        </div>
      </div>
    </div>

  </div>
  <div class="container-fluid mt-5">
    <footer class="footer row bg-success text-white font-weight-bold justify-content-center ">
      <p class="footer-text m-0 p-3">&copy; 2024 SMART SELLER. All Rights Reserved.</p>
    </footer>
  </div>
</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
  <script>
    // Thay đổi ảnh chính khi nhấp vào thumbnail
    function changeMainImage(thumbnail) {
      const mainImage = document.getElementById('mainImageDisplay');
      if (mainImage && thumbnail) {
        mainImage.src = thumbnail.src;

        // Bỏ class 'active' khỏi tất cả thumbnails
        document.querySelectorAll('.product-thumbnail').forEach((thumb) => {
          thumb.classList.remove('active');
        });

        // Thêm class 'active' cho thumbnail được chọn
        thumbnail.classList.add('active');
      }
    }

    // var cartCount = /*[[${cartCount}]]*/
    //     localStorage.setItem("cartCount", cartCount)

    var cartCount = localStorage.getItem("cartCount");
    cartCount = cartCount !== null ? parseInt(cartCount) : 0;
    if (isNaN(cartCount)) {
      cartCount = 0;
    }
    updateCartCount(cartCount);

    // Thêm sản phẩm vào giỏ hàng
    function addToCart(productID, redirectToCart = false) {
      $.ajax({
        url: '/cart/add',
        method: 'POST',
        data: { productId: productID },
        success: function(response) {
          // Thông báo thêm sản phẩm thành công
          notifyOrder('Đã thêm sản phẩm vào giỏ hàng!');

          // Nếu tham số redirectToCart là true, chuyển hướng đến trang giỏ hàng
          if (redirectToCart) {
            window.location.href = "/cart"; // Chuyển hướng đến trang giỏ hàng
          }
        },
        error: function() {
          // Thông báo lỗi khi thêm vào giỏ hàng
          notifyOrder('Không thể thêm sản phẩm vào giỏ hàng!', true);
        }
      });
    }
    //Thông báo khi nhấn nút đặt hàng
    function notifyOrder(message, isError = false) {
      // Tạo popup
      const popup = document.createElement("div");
      popup.className = "order-notify";
      popup.textContent = message;

      // Nếu là thông báo lỗi, thêm class lỗi
      if (isError) {
        popup.classList.add("error");
      }

      // Thêm popup vào body
      document.body.appendChild(popup);

      // Đặt vị trí dựa trên số lượng popup hiện có
      const existingPopups = document.querySelectorAll(".order-notify");
      const offset = 50; // Khoảng cách từ mép trên
      const popupHeight = 60; // Chiều cao giả định của mỗi popup (bao gồm margin)
      const topPosition = offset + existingPopups.length * popupHeight;

      popup.style.top = `${topPosition}px`;

      // Tự động ẩn popup sau 2 giây
      setTimeout(() => {
        popup.remove();
        adjustPopups(); // Điều chỉnh vị trí popup sau khi xóa
      }, 2000);

    }

    // Điều chỉnh vị trí của các popup còn lại
    function adjustPopups() {
      const remainingPopups = document.querySelectorAll(".order-notify");
      const offset = 50;
      remainingPopups.forEach((popup, index) => {
        popup.style.top = `${offset + index * 60}px`;
      });
    }

    // Cập nhật số lượng sản phẩm trong giỏ
    function updateCartCount(quantity) {
      $('#cartCountBadge').text(quantity)
    }

  </script>
</body>
</html>
