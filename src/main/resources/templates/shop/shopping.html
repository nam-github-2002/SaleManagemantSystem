<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Seller | Cửa hàng</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/image/logoSmartSeller.png}" type="image/x-icon">
    <link rel="shortcut icon" href="img/logoSmartSeller.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- jQuery đầy đủ -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>


    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--Excel-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


    <link rel="stylesheet" th:href="@{/css/shopping.css}">
    <script th:src="@{/js/shopping.js}"></script>

</head>
<body>
<div class="container-fluid">
    <div class="row header-shop-top bg-success text-white p-2 sticky-top">
        <div class="col-md-4 col-sm-6 my-1 d-flex align-items-center justify-content-center">
            <i class="fa-solid fa-calendar-days mr-2"> </i>
            <span id="current-date"> 16/11/2024</span>
        </div>
        <div class="col-md-4 my-1 col"></div>
        <div class="col-md-4 my-1 col-sm-5">
            <div class="user-info d-flex align-items-center justify-content-center">
                <!-- Kiểm tra nếu người dùng đã đăng nhập -->
                <div th:if="${loggedInCustomer == null}">
                    <!-- Nếu chưa đăng nhập, hiển thị nút đăng nhập và đăng ký -->
                    <a href="/login" class="btn btn-primary mx-2">Đăng nhập</a>
                    <a href="/register" class="btn btn-success mx-2">Đăng ký</a>
                </div>

                <div th:if="${loggedInCustomer != null}" class="d-flex">
                    <!-- Nếu đã đăng nhập, hiển thị avatar và menu -->
                    <div class="dropdown">
                        <img th:src="${loggedInCustomer != null ? '/employees/display?id=' + loggedInCustomer.customerID : '/images/noimage.jpg'}"
                             class="rounded-circle"
                             style="width: 20px; height: 20px;"
                             id="user-avatar" data-toggle="dropdown" aria-expanded="false">

                        <ul class="dropdown-menu" aria-labelledby="user-avatar">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user text-primary"></i> Tài khoản của tôi</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-clipboard-list text-info"></i> Đơn mua</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-bell text-warning"></i> Thông báo</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle text-warning"></i> Hỗ trợ</a></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item border-0" type="submit">
                                        <i class="fas fa-sign-out-alt text-secondary"></i> Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                    <div class="user-text">
                        <p class="m-0" th:text="${loggedInCustomer != null ? 'Xin Chào ' + loggedInCustomer.name : ' '}">Xin chào,</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logo và thương hiệu -->
        <div class="col-md-3 col-sm-3 my-1 text-center">
            <a class="navbar-brand d-flex align-items-center justify-content-center" href="#">
                <!-- <img src="logoSmartSeller.png" alt="logo" style="width:75px;" class="mr-2"> -->
                <span class="font-weight-bold text-white">SMART SELLER</span>
            </a>
        </div>
        <!-- Form tìm kiếm -->
        <div class="col-md-6 col-sm-7 my-1">
            <form id="nav-form-search" class="form-inline">
                <div class="input-group w-100  justify-content-center">
                    <!-- Danh mục sản phẩm -->
                    <select name="" id="select-product-category" class="custom-select col-3">
                        <option value="">Tất cả</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Smartphones">Smartphones</option>
                        <option value="Tablets">Tablets</option>
                        <option value="Desktops">Desktops</option>
                        <option value="Giày dép">Giày dép</option>
                        <option value="Mỹ phẩm">Mỹ phẩm</option>
                        <option value="Sức khỏe">Sức khỏe</option>
                        <option value="Gia dụng">Gia dụng</option>
                        <option value="Nhà cửa">Nhà cửa</option>
                        <option value="Oto xe máy">Oto xe máy</option>

                    </select>

                    <!-- Ô tìm kiếm -->
                    <input type="text" class="form-control col-7" placeholder="Tìm sản phẩm, thương hiệu,...">

                    <!-- Nút tìm kiếm -->
                    <div class="input-group-append">
                        <button class="btn btn-light" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- giỏ hàng -->
        <div th:classappend="${loggedInCustomer != null ? '' : 'd-none'}" class="col-md-3 col-sm-2 my-1 text-center justify-content-center align-items-center">
            <div class="header-top-main-cart position-relative p-0" style="width: 30px;margin: 10px auto;">
                <!-- Nút giỏ hàng -->
                <a class="nav-link d-flex align-items-center justify-content-center text-white position-relative"
                   href="/cart" id="cartIcon" style=" width: 30px; height: 20px;">
                    <i class="fas fa-shopping-cart fa-lg" style=" z-index: 10;"></i>
                    <span class="badge-pill badge-danger" id="cartCountBadge" style=" z-index: 12;position: absolute;
                        top: 0;  left: 50%; width: 20px;transform: translate(20%, -60%);height: 20px;padding: 0 0 6px;">0</span>
                </a>
            </div>
        </div>

    </div>


    <h1 class="mb-4 text-center">Shop</h1>
    <!-- Hiển thị sản phẩm -->
    <div class="d-flex flex-wrap justify-content-center">

        <div class="col-md-2 col-sm-3 col-6" th:each="product : ${products}">
            <div class="card product-card mb-4">
            <!-- Hình ảnh sản phẩm -->
            <img th:src="@{'/products/display?id=' + ${productImages[product.productID]}}"
                 th:alt="${product.productName}"
                 class="card-img-top" alt="Hình ảnh sản phẩm">
            <div class="card-body">
                <!-- Tên sản phẩm -->
                <h5 class="card-title" th:text="${product.productName}">Tên sản phẩm</h5>
                <!-- Mã sản phẩm -->
                <p class="card-text" th:text="'ID: ' + ${product.productID}">Mã sản phẩm</p>
                <!-- Giá sản phẩm -->
                <p class="card-text text-danger font-weight-bold" th:text="${product.price} + ' VND'">Giá</p>
                <!-- Nút xem chi tiết -->
                <a th:href="@{/productDetail/{id}(id=${product.productID})}"
                   class="btn btn-primary btn-sm">Xem chi tiết</a>
                <!-- Nút thêm vào giỏ hàng -->
                <a href="#" th:classappend="${loggedInCustomer != null ? '' : 'd-none'}"
                   class="btn btn-warning btn-sm"
                   th:onclick="|addToCart(${product.productID})|">
                    <i class="fas fa-cart-plus"></i>
                </a>
            </div>
        </div>
        </div>
    </div>


    <!-- Kiểm tra nếu danh sách sản phẩm trống -->
    <div class="text-center" th:if="${#lists.isEmpty(products)}">
        <p>Không có sản phẩm nào để hiển thị.</p>
    </div>

    <!-- Phân trang -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- Nút lùi trang -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- Số trang -->
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}"></a>
            </li>

            <!-- Nút tới trang -->
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
    <footer class="footer row bg-success text-white font-weight-bold justify-content-center ">
        <p class="footer-text m-0 p-3">&copy; 2024 SMART SELLER. All Rights Reserved.</p>
    </footer>

    <script>

        // Thêm sản phẩm vào giỏ hàng
        function addToCart(productId) {
            $.ajax({
                url: '/cart/add',
                method: 'POST',
                data: { productId: productId },
                success: function (response) {
                    updateCartCount(response.cartItems); // Cập nhật số lượng sản phẩm
                },
                error: function (xhr) {
                    console.error('Lỗi khi thêm vào giỏ hàng:', xhr.responseText);
                    alert('Không thể thêm sản phẩm vào giỏ hàng!');
                }
            });
        }

        // Cập nhật số lượng sản phẩm trong giỏ
        function updateCartCount(cartItems) {
            const $cartCountBadge = $("#cartCountBadge");
            const totalCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);

            if (totalCount > 0) {
                $cartCountBadge.text(totalCount).show();
            } else {
                $cartCountBadge.hide();
            }
        }

    </script>
</div>
</body>
</html>
