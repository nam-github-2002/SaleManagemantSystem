<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm với DataTables và bộ lọc</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Danh sách sản phẩm</h2>

    <!-- Dropdown lọc theo danh mục -->
    <div class="form-group">
        <label for="categoryFilter">Lọc theo danh mục:</label>
        <select id="categoryFilter" class="form-control">
            <option value="">Tất cả</option>
            <option value="Điện tử">Điện tử</option>
            <option value="Thời trang">Thời trang</option>
            <option value="Gia dụng">Gia dụng</option>
        </select>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <table id="productTable" class="table table-bordered table-hover">
        <thead class="thead-dark">
            <tr>
                <th>#</th>
                <th>Tên sản phẩm</th>
                <th>Danh mục</th> <!-- Thêm cột Danh mục -->
                <th>Mô tả</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Trạng thái</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Sản phẩm A</td>
                <td>Điện tử</td>
                <td>Sản phẩm chất lượng cao</td>
                <td>200,000 VND</td>
                <td>10</td>
                <td>Còn hàng</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sản phẩm B</td>
                <td>Thời trang</td>
                <td>Hàng mới về</td>
                <td>150,000 VND</td>
                <td>5</td>
                <td>Hết hàng</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Sản phẩm C</td>
                <td>Gia dụng</td>
                <td>Giảm giá 20%</td>
                <td>180,000 VND</td>
                <td>8</td>
                <td>Còn hàng</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- jQuery, Popper.js, Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>

<script>
    $(document).ready(function() {
        // Khởi tạo DataTable
        var table = $('#productTable').DataTable();

        // Lọc theo danh mục
        $('#categoryFilter').on('change', function () {
            var category = $(this).val();
            if (category) {
                // Lọc theo cột "Danh mục" (cột thứ 3, bắt đầu từ 0)
                table.column(2).search(category).draw();
            } else {
                // Hiển thị tất cả nếu chọn "Tất cả"
                table.column(2).search('').draw();
            }
        });
    });
</script>
</body>
</html>
