<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/fragment :: head}"></div>
</head>
<body>
<div class="container-fluid">

    <!-- header -->
    <div th:replace="~{fragments/fragment :: header}"></div>

    <!-- section -->
    <div class="d-flex" style="height: calc(100vh - 60px);">

        <!-- Sidebar-->
        <nav th:replace="~{fragments/fragment :: sidebar}"></nav>
        <!-- Sidebar -->

        <div id="mainArea">
            <div th:fragment="employeePage">
                <section class="content-header">
                    <h1>Quản lý nhân viên</h1>
                    <ol class="breadcrumb">
                        <li><a href="/" onclick="getContent(event, this.href)"><i class="fa fa-home"></i>Home</a></li>
                        <li class="active"><i class="fas fa-box"></i>Employee</li>
                    </ol>
                </section>

                <section class="content-main px-3">
                    <div class="productMan">

                        <!-- Search bar -->
                        <div class="row mb-3">
                            <!-- Cột nút hành động -->
                            <div class="col-md-6">
                                <a  onclick="getContent(event, this.href)" href="/employees/new" class="btn btn-primary btn-sm">+ Thêm nhân viên</a>
                                <button id="exportExcelBtn"
                                        class="btn btn-success btn-sm"
                                        onclick="exportTableToExcel()">Xuất ra Excel</button>
                            </div>

                            <!-- Tìm kiếm -->
                            <div class="form-inline ml-auto">
                                <button type="button" class="btn btn-primary"
                                        data-toggle="modal" data-target="#searchModal"
                                        onclick="focusInput()">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                    Tìm kiếm
                                </button>

                                <!-- Modal -->
                                <div class="modal fade" id="searchModal" tabindex="-1" role="dialog" aria-labelledby="searchModalLabel" aria-hidden="true">
                                    <div class="modal-dialog" role="document">
                                        <div class="modal-content">

                                            <div class="modal-body">

                                                <form th:action="@{/employees}"
                                                      method="GET"
                                                      onsubmit="searchContent(event, this); closeModal()"
                                                      class="d-flex search-form">
                                                    <input type="text"
                                                           class="search-input"
                                                           placeholder="Tìm kiếm..."
                                                           name="keyword"
                                                           th:value="${keyword}"
                                                           aria-label="Search">
                                                    <button id="search-submit" type="submit">
                                                        <i class="fa-solid fa-magnifying-glass" style="font-size: 30px"></i>
                                                    </button>
                                                </form>

                                            </div>

                                        </div>
                                    </div>
                                </div>

                            </div>
                            <!-- Tìm kiếm -->

                        </div>
                        <!-- Search bar -->

                        <!-- Table  -->
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Name</th>
                                    <th>Phòng ban</th>
                                    <th>Chức vụ</th>
                                    <th>Trạng thái</th>
                                    <th>Thao Tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="employee : ${employees}">
                                    <td th:text="${employee.employeeId}"></td>
                                    <td th:text="${employee.name}"></td>
                                    <td th:text="${employee.department}" ></td>
                                    <td th:text="${employee.role}"></td>
                                    <td th:text="${employee.status}"></td>
                                    <td>
                                        <a class="btn btn-hover-shine btn-outline-primary border-0 btn-sm"
                                           th:href="@{/employees/detail/{id}(id=${employee.employeeId})}"
                                           onclick="getContent(event, this.href)">
                                            Detail
                                        </a>
                                        <a style="text-decoration: none"
                                           th:href="@{/employees/edit/{id}(id=${employee.employeeId})}"
                                           onclick="getContent(event, this.href)">
                                            <button class="btn btn-outline-warning border-0 btn-sm"><i class="fa-solid fa-pen-to-square"></i></button>
                                        </a>

                                        <form th:action="@{/employees/delete/{id}(id=${employee.employeeId})}"
                                              method="post" style="display:inline;"
                                              onsubmit="postContent(event, this)">
                                            <input type="hidden" name="_method" value="DELETE" />
                                            <button type="submit" class="btn btn-outline-danger border-0 btn-sm">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>

                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Table  -->


                        <!-- Phân trang -->
                        <nav class="d-flex justify-content-end">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link"
                                       onclick="getContent(event, this.href)"
                                       th:href="@{'/employees?page=0&keyword=' + keyword}">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link"
                                       onclick="getContent(event, this.href)"
                                       th:href="@{'/employees?page=' + ${i} + '&keyword=' + ${keyword}}">
                                        <span th:text="${i + 1}"></span>
                                    </a>
                                </li>
                                <li class="page-item"  th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link"
                                       onclick="getContent(event, this.href)"
                                       th:href="@{'/employees?page=' + ${totalPages - 1} + '&keyword=' + ${keyword}}">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                        <!-- Phân trang -->

                    </div>
                </section>

                <!-- footer -->
                <div th:replace="~{fragments/fragment :: footer}"></div>
            </div>
        </div>
    </div>
    <!-- section -->

</div>
</body>
</html>
